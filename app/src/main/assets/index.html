<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flipside</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2431D6;
    --deep: #141A7A;
    --pink: #FF5C93;
    --blush: #FFE3EC;
    --sun: #FFD23F;
    --font: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--ink);
    font-family: var(--font);
  }

  /* the game fills the whole screen */
  .stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--ink);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100%; height: 100%; }

  /* measures the phone's notch / rounded-corner insets */
  .probe {
    position: fixed;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    visibility: hidden;
    pointer-events: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }

  .pausebtn {
    position: fixed;
    z-index: 5;
    display: grid;
    place-items: center;
    padding: 0;
    border-radius: 10px;
    border: 2px solid rgba(255, 227, 236, 0.6);
    background: var(--deep);
    color: var(--blush);
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .pausebtn svg { width: 46%; height: 46%; }
  .pausebtn:active { background: #2A32A6; }
  .pausebtn:focus-visible { outline: 3px solid var(--blush); outline-offset: 2px; }

  /* boost (booster rocket) button */
  .boostbtn {
    position: fixed;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    gap: calc(var(--bb, 46px) * 0.02);
    padding: 0;
    border-radius: 50%;
    border: 2px solid rgba(255, 227, 236, 0.6);
    border-width: max(2px, calc(var(--bb, 46px) * 0.03));
    background: var(--deep);
    color: rgba(255, 227, 236, 0.7);
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .boostbtn .ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); pointer-events: none; }
  .boostbtn .ring circle { fill: none; stroke-width: 6; }
  .boostbtn .ring .track { stroke: rgba(255, 227, 236, 0.16); }
  .boostbtn .ring .prog { stroke: currentColor; stroke-linecap: round; stroke-dasharray: 289; stroke-dashoffset: 0; }
  .boostbtn .ico { position: relative; width: 48%; height: 48%; }
  .boostbtn .lbl { position: relative; font-size: 8px; font-size: calc(var(--bb, 46px) * 0.17); font-weight: 800; letter-spacing: 0; line-height: 1; }
  .boostbtn.ready { color: var(--sun); border-color: var(--sun); }
  .boostbtn::after { content: ''; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid rgba(255, 210, 63, 0.6); border-width: max(2px, calc(var(--bb, 46px) * 0.03)); opacity: 0; pointer-events: none; }
  .boostbtn.ready::after { animation: boostpulse 1.6s ease-out infinite; will-change: transform, opacity; }
  .boostbtn.cool { color: rgba(255, 227, 236, 0.7); }
  .boostbtn.active { color: var(--pink); border-color: var(--pink); }
  .boostbtn:active { background: #2A32A6; }
  .boostbtn:focus-visible { outline: 3px solid var(--blush); outline-offset: 3px; }
  @keyframes boostpulse {
    0% { transform: scale(1); opacity: 0.6; }
    70%, 100% { transform: scale(1.3); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .boostbtn.ready::after { animation: none; } }
  @media (max-height: 520px) {
    .boostbtn .lbl { display: none; }
    .boostbtn .ico { width: 52%; height: 52%; }
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px;
    text-align: center;
    color: var(--blush);
    background: var(--scrim, rgba(20, 26, 122, 0.62));
  }
  .title {
    margin: 0;
    font-weight: 800;
    font-size: clamp(40px, min(10vw, 18vh), 104px);
    line-height: 0.95;
    letter-spacing: -0.04em;
    color: var(--blush);
  }
  .title.sm { font-size: clamp(32px, min(6vw, 13vh), 60px); }
  .flipped {
    display: inline-block;
    transform: rotate(180deg);
    margin-left: 0.04em;
  }
  .lede {
    margin: 0;
    max-width: 34ch;
    font-size: clamp(15px, 2.2vw, 20px);
    font-weight: 500;
    line-height: 1.45;
  }
  .stats { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .stats .score {
    font-size: clamp(52px, min(11vw, 20vh), 110px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.03em;
    color: var(--sun);
  }
  .stats .sub { font-size: clamp(15px, 2.2vw, 20px); font-weight: 600; }

  .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 4px; }
  .btn {
    font: inherit;
    font-weight: 800;
    font-size: 18px;
    color: var(--deep);
    background: var(--sun);
    border: 2px solid var(--sun);
    border-radius: 14px;
    padding: 11px 28px;
    box-shadow: 4px 4px 0 var(--deep);
    cursor: pointer;
  }
  .btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--deep); }
  .btn:focus-visible { outline: 3px solid var(--blush); outline-offset: 3px; }
  .btn.alt {
    color: var(--blush);
    background: transparent;
    border-color: var(--blush);
    box-shadow: none;
  }
  .btn.alt:active { transform: none; background: rgba(255, 227, 236, 0.16); }

  /* ---- map selection ---- */
  .overlay.maps {
    justify-content: flex-start;
    overflow-y: auto;
    touch-action: pan-y;
    padding-top: max(16px, env(safe-area-inset-top));
    padding-bottom: max(16px, env(safe-area-inset-bottom));
  }
  .mapwrap {
    margin: auto;
    width: min(460px, 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .mapwrap .title { font-size: clamp(30px, min(8vw, 8vh), 54px); }
  .maptotal { display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
  .maptotal .lab { font-size: 14px; font-weight: 600; opacity: 0.85; }
  .maptotal .num {
    font-size: clamp(30px, min(9vw, 8vh), 46px);
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--sun);
  }
  .mapnew {
    margin: 0;
    padding: 8px 14px;
    border-radius: 12px;
    background: var(--sun);
    color: var(--deep);
    font-weight: 800;
    font-size: 15px;
  }
  .maplist { width: 100%; display: flex; flex-direction: column; gap: 10px; }
  .mapcard {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 10px;
    font: inherit;
    text-align: left;
    color: var(--blush);
    background: rgba(255, 227, 236, 0.10);
    border: 2px solid rgba(255, 227, 236, 0.35);
    border-radius: 14px;
    box-shadow: 4px 4px 0 var(--deep);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .mapcard:focus-visible { outline: 3px solid var(--blush); outline-offset: 3px; }
  .mapcard.picked { border-color: var(--sun); background: rgba(255, 210, 63, 0.16); }
  .mapcard.locked { border-style: dashed; background: rgba(0, 0, 0, 0.18); }
  .mapcard.shake { animation: mapshake 0.35s; }
  @keyframes mapshake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  @media (prefers-reduced-motion: reduce) { .mapcard.shake { animation: none; } }
  .mapthumb {
    flex: none;
    width: 116px;
    height: 68px;
    display: block;
    border-radius: 8px;
    border: 2px solid rgba(255, 227, 236, 0.4);
  }
  .mapcard.locked .mapthumb { filter: grayscale(0.75) brightness(0.62); }
  .mapinfo { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
  .maphead { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; }
  .mapname { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
  .mapstate {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
  }
  .mapstate.on { background: var(--sun); color: var(--deep); }
  .mapstate.off { border: 1.5px solid var(--blush); color: var(--blush); }
  .mapsel { display: none; font-size: 12px; font-weight: 800; color: var(--sun); }
  .mapcard.picked .mapsel { display: inline; }
  .mapneed { font-size: 13px; font-weight: 600; opacity: 0.92; }
  .mapdesc { font-size: 13px; opacity: 0.75; }
  .mapbar { display: block; height: 8px; border-radius: 999px; background: rgba(255, 227, 236, 0.18); overflow: hidden; }
  .mapbar i { display: block; height: 100%; background: var(--sun); }
  .mapprog { font-size: 12px; font-weight: 700; opacity: 0.9; }
  .mapmsg { min-height: 1.3em; margin: 0; font-size: 14px; font-weight: 600; text-align: center; }
  @media (max-height: 520px) {
    .mapwrap { width: min(860px, 100%); gap: 8px; }
    .maplist { flex-direction: row; }
    .mapcard { flex: 1; flex-direction: column; align-items: stretch; min-width: 0; text-align: center; padding: 8px; }
    .mapthumb { width: 100%; height: auto; aspect-ratio: 116 / 68; }
    .maphead { justify-content: center; }
    .mapdesc { display: none; }
  }

  /* ---- home menu ---- */
  .homemenu { display: flex; gap: 10px; justify-content: center; width: min(420px, 100%); margin-top: 6px; }
  .tile {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 10px 6px;
    font: inherit;
    font-weight: 800;
    font-size: 15px;
    color: var(--blush);
    background: rgba(255, 227, 236, 0.10);
    border: 2px solid rgba(255, 227, 236, 0.4);
    border-radius: 14px;
    box-shadow: 4px 4px 0 var(--deep);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .tile svg { width: 28px; height: 28px; }
  .tile:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--deep); }
  .tile:focus-visible { outline: 3px solid var(--blush); outline-offset: 3px; }

  /* ---- sprites ---- */
  .spritelist { width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .spritecard {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    min-width: 0;
    padding: 10px 8px;
    font: inherit;
    text-align: center;
    color: var(--blush);
    background: rgba(255, 227, 236, 0.10);
    border: 2px solid rgba(255, 227, 236, 0.35);
    border-radius: 14px;
    box-shadow: 4px 4px 0 var(--deep);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .spritecard:focus-visible { outline: 3px solid var(--blush); outline-offset: 3px; }
  .spritecard.picked { border-color: var(--sun); background: rgba(255, 210, 63, 0.16); }
  .spritecard.locked { border-style: dashed; background: rgba(0, 0, 0, 0.18); }
  .spritecard.shake { animation: mapshake 0.35s; }
  @media (prefers-reduced-motion: reduce) { .spritecard.shake { animation: none; } }
  .spritethumb { width: 88px; height: 64px; display: block; border-radius: 8px; border: 2px solid rgba(255, 227, 236, 0.4); }
  .spritecard.locked .spritethumb { filter: grayscale(0.75) brightness(0.62); }
  .spritecard .mapbar { width: 100%; }
  .spritecard { padding: 8px; gap: 4px; }
  .spritecard .mapneed { font-size: 12px; }
  #spriteOverlay, #settingsOverlay { background: linear-gradient(rgba(0, 0, 0, 0.28), rgba(0, 0, 0, 0.28)), var(--scrim, rgba(20, 26, 122, 0.62)); }
  .spritecard .mapsel { display: none; }
  .spritecard.picked .mapsel { display: inline; }

  /* ---- settings ---- */
  .setlist { width: 100%; display: flex; flex-direction: column; gap: 10px; }
  .setrow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 14px;
    text-align: left;
    background: rgba(255, 227, 236, 0.10);
    border: 2px solid rgba(255, 227, 236, 0.35);
    border-radius: 14px;
    box-shadow: 4px 4px 0 var(--deep);
  }
  .setinfo { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .setname { font-size: 20px; font-weight: 800; }
  .setdesc { font-size: 13px; opacity: 0.8; }
  .switch {
    flex: none;
    min-width: 84px;
    padding: 9px 16px;
    font: inherit;
    font-weight: 800;
    font-size: 17px;
    color: var(--blush);
    background: transparent;
    border: 2px solid var(--blush);
    border-radius: 999px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .switch.on { color: var(--deep); background: var(--sun); border-color: var(--sun); }
  .switch:focus-visible { outline: 3px solid var(--blush); outline-offset: 3px; }

  @media (max-height: 520px) {
    .homemenu { margin-top: 2px; gap: 8px; }
    .tile { flex-direction: row; justify-content: center; padding: 8px; font-size: 14px; }
    .tile svg { width: 20px; height: 20px; }
    #overlay .lede { font-size: 14px; line-height: 1.3; }
    .spritelist { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

  /* ---- splash screen: dissolves in, holds, dissolves out ---- */
  .splash {
    position: fixed;
    inset: 0;
    z-index: 100;
    overflow: hidden;
    background: #000;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  .splash img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  /* On wide screens the artwork sits in a thin tall strip, so zoom in on the logo (it sits a little above the middle). */
  @media (min-aspect-ratio: 1/1) {
    .splash img { transform: translateY(3.3%) scale(2.4); transform-origin: 50% 46.7%; }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="game" role="img" aria-label="Flipside game. Tap to flip gravity and dodge the obstacles."></canvas>
  <div class="overlay" id="overlay">
    <h1 class="title" id="ovTitle" aria-label="Flipside">Flip<span class="flipped">side</span></h1>
    <p class="lede" id="ovText">Flip gravity to dodge the obstacles.<br>Tap, click or press Space.</p>
    <div class="stats" id="ovStats" hidden></div>
    <div class="actions">
      <button class="btn" id="ovBtn" type="button">Play</button>
      <button class="btn alt" id="ovMaps" type="button" hidden>Maps</button>
      <button class="btn alt" id="ovSound" type="button" hidden>Sound on</button>
    </div>
    <div class="homemenu" id="homeMenu" hidden>
      <button class="tile" id="homeMaps" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"/></svg><span>Maps</span></button>
      <button class="tile" id="homeSprites" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4.5" fill="currentColor"/><circle cx="9.4" cy="11.2" r="1.8" fill="var(--deep)"/><circle cx="14.6" cy="11.2" r="1.8" fill="var(--deep)"/></svg><span>Sprites</span></button>
      <button class="tile" id="homeSettings" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor"><circle cx="12" cy="12" r="6.3" fill="none" stroke="currentColor" stroke-width="3.4"/><rect x="10.4" y="1.4" width="3.2" height="4.2" rx="1" transform="rotate(0 12 12)"/><rect x="10.4" y="1.4" width="3.2" height="4.2" rx="1" transform="rotate(45 12 12)"/><rect x="10.4" y="1.4" width="3.2" height="4.2" rx="1" transform="rotate(90 12 12)"/><rect x="10.4" y="1.4" width="3.2" height="4.2" rx="1" transform="rotate(135 12 12)"/><rect x="10.4" y="1.4" width="3.2" height="4.2" rx="1" transform="rotate(180 12 12)"/><rect x="10.4" y="1.4" width="3.2" height="4.2" rx="1" transform="rotate(225 12 12)"/><rect x="10.4" y="1.4" width="3.2" height="4.2" rx="1" transform="rotate(270 12 12)"/><rect x="10.4" y="1.4" width="3.2" height="4.2" rx="1" transform="rotate(315 12 12)"/></g></svg><span>Settings</span></button>
    </div>
  </div>

  <!-- Map selection: shown after the title screen, and from the game-over screen -->
  <div class="overlay maps" id="mapOverlay" hidden>
    <div class="mapwrap">
      <h2 class="title sm">Choose a map</h2>
      <div class="maptotal" aria-live="polite">
        <span class="lab">Total score</span>
        <span class="num" id="mapTotal">0</span>
      </div>
      <p class="mapnew" id="mapNew" hidden></p>
      <div class="maplist" id="mapList" role="radiogroup" aria-label="Maps"></div>
      <p class="mapmsg" id="mapMsg" aria-live="polite"></p>
      <div class="actions">
        <button class="btn" id="mapPlay" type="button">Play</button>
        <button class="btn alt" id="mapBack" type="button">Back</button>
      </div>
    </div>
  </div>

  <!-- Sprites: cosmetic player skins -->
  <div class="overlay maps" id="spriteOverlay" hidden>
    <div class="mapwrap">
      <h2 class="title sm">Sprites</h2>
      <div class="maptotal" aria-live="polite">
        <span class="lab">Total score</span>
        <span class="num" id="spriteTotal">0</span>
      </div>
      <p class="mapnew" id="spriteNew" hidden></p>
      <div class="spritelist" id="spriteList" role="radiogroup" aria-label="Sprites"></div>
      <p class="mapmsg" id="spriteMsg" aria-live="polite"></p>
      <div class="actions">
        <button class="btn alt" id="spriteBack" type="button">Back</button>
      </div>
    </div>
  </div>

  <!-- Settings -->
  <div class="overlay maps" id="settingsOverlay" hidden>
    <div class="mapwrap">
      <h2 class="title sm">Settings</h2>
      <div class="setlist">
        <div class="setrow">
          <div class="setinfo">
            <span class="setname" id="setSoundName">Sound</span>
            <span class="setdesc" id="setSoundDesc">Music and sound effects</span>
          </div>
          <button class="switch on" id="setSound" type="button" role="switch" aria-checked="true" aria-labelledby="setSoundName"><span id="setSoundLbl">On</span></button>
        </div>
      </div>
      <div class="actions">
        <button class="btn alt" id="setBack" type="button">Back</button>
      </div>
    </div>
  </div>
</div>

<button class="pausebtn" id="pauseBtn" type="button" aria-label="Pause" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <rect x="5" y="4" width="5" height="16" rx="1.5" fill="currentColor"/>
    <rect x="14" y="4" width="5" height="16" rx="1.5" fill="currentColor"/>
  </svg>
</button>
<button class="boostbtn ready" id="boostBtn" type="button" aria-label="Boost, ready" hidden>
  <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
    <circle class="track" cx="50" cy="50" r="46"/>
    <circle class="prog" id="boostRing" cx="50" cy="50" r="46"/>
  </svg>
  <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
    <path fill="currentColor" d="M12 1.5c3.2 2.6 4.6 6 4.6 9.6V16l-2.2 2.2H9.6L7.4 16v-4.9C7.4 7.5 8.8 4.1 12 1.5z"/>
    <path fill="currentColor" d="M7.2 12.6 3.8 16.4V19l3.6-1.8zM16.8 12.6l3.4 3.8V19l-3.6-1.8z"/>
    <path fill="currentColor" d="M9.8 19.4c0 1.6.8 2.6 2.2 3.2 1.4-.6 2.2-1.6 2.2-3.2z"/>
    <circle cx="12" cy="9.6" r="2" fill="#141A7A"/>
  </svg>
  <span class="lbl" id="boostLbl">BOOST</span>
</button>

<script src="https://www.youtube.com/game_api/v1"></script>
<script>
(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const stage = $('stage'), canvas = $('game'), ctx = canvas.getContext('2d', { alpha: false });
  const overlay = $('overlay'), ovTitle = $('ovTitle'), ovText = $('ovText');
  const ovStats = $('ovStats'), ovBtn = $('ovBtn'), ovSound = $('ovSound');
  const pauseBtn = $('pauseBtn'), probe = $('probe');
  const boostBtn = $('boostBtn'), boostRing = $('boostRing'), boostLbl = $('boostLbl');
  const mapOverlay = $('mapOverlay'), mapList = $('mapList'), mapTotal = $('mapTotal'), mapNew = $('mapNew');
  const mapMsg = $('mapMsg'), mapPlay = $('mapPlay'), mapBack = $('mapBack'), ovMaps = $('ovMaps');
  const homeMenu = $('homeMenu'), homeMaps = $('homeMaps'), homeSprites = $('homeSprites'), homeSettings = $('homeSettings');
  const spriteOverlay = $('spriteOverlay'), spriteList = $('spriteList'), spriteTotal = $('spriteTotal'), spriteNew = $('spriteNew');
  const spriteMsg = $('spriteMsg'), spriteBack = $('spriteBack');
  const settingsOverlay = $('settingsOverlay'), setSound = $('setSound'), setSoundLbl = $('setSoundLbl'), setSoundDesc = $('setSoundDesc'), setBack = $('setBack');

  const C = { ink: '#2431D6', deep: '#141A7A', pink: '#FF5C93', blush: '#FFE3EC', sun: '#FFD23F' };
  const FONT = '"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif';

  const S = 34;            // player size
  const BAND = 48;         // minimum wall thickness
  const CORR_MAX = 800;    // tallest corridor (extra height on tall phones becomes wall)
  const G0 = 5200, V0 = 1500, KICK0 = 160;   // physics tuned for a 444px corridor
  const BASE = 380;        // starting scroll speed
  const ORB_POINTS = 40;
  const MEGA_POINTS = 150;

  // ---- Soul (fuel) tuning: the meter runs from 0 to 100 ----
  const SOUL_DRAIN_START = 3.8;   // points lost per second at the start of a run
  const SOUL_DRAIN_END = 5.8;     // points lost per second at full difficulty (about 70 seconds in)
  const SOUL_DRAIN_LATE = 2.4;    // extra points per second added slowly between 70 and 170 seconds
  const SOUL_COIN_GAIN = 50;      // a normal coin refuels half of the meter
  const COIN_SWAY_START = 15;     // seconds into a run before coins start moving left and right
  const COIN_SWAY_RAMP = 60;      // seconds it takes the sway to reach full strength
  const COIN_SWAY_TIME = 0.18;    // full-strength sway distance, measured in seconds of scrolling
  const MEGA_CHANCE = 0.09;       // chance that a coin turns out to be a mega coin
  const MEGA_COOLDOWN = 20;       // minimum seconds between two mega coins

  // ---- Boost (booster rocket) tuning ----
  const BOOST_COOLDOWNS = [120, 300, 600];  // seconds until the boost refreshes after use #1, use #2, and use #3 onwards (2 min, 5 min, 10 min)
  const BOOST_FIRST_READY = 0;              // seconds into a run before the first boost is ready (0 = ready straight away, 120 = after 2 minutes)
  const BOOST_DURATION = 5;                 // seconds of rocket flight
  const BOOST_SPEED = 1.55;                 // how much faster the world scrolls during a boost
  const BOOST_COIN_POINTS = 12;             // score for each coin along the rocket's path
  const BOOST_COIN_SOUL = 10;               // soul refuelled by each of those coins (percent)
  const BOOST_COIN_SPACING = 150;           // distance between those coins

  const rand = (a, b) => a + Math.random() * (b - a);
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  const reduceMq = window.matchMedia('(prefers-reduced-motion: reduce)');
  let reduce = reduceMq.matches;
  if (reduceMq.addEventListener) reduceMq.addEventListener('change', (e) => { reduce = e.matches; });

  // ---------- storage (always guarded) ----------
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) { /* ignore */ }
    }
  };
  let best = parseInt(store.get('flipside-best') || '0', 10) || 0;
  let soundOn = store.get('flipside-sound') !== 'off';

  // ---------- YouTube Playables integration ----------
  // YouTube provides the ad experience. Outside YouTube, these calls are no-ops.
  const ytInPlayables = () => typeof ytgame !== 'undefined' && !!ytgame.IN_PLAYABLES_ENV;
  let ytAudioEnabled = true;
  let ytExternallyPaused = false;
  let ytWasPlayingBeforePause = false;
  let ytReadyNotified = false;
  let ytGameReadyNotified = false;
  let ytAdBusy = false;

  function ytHandleAudio(enabled) {
    ytAudioEnabled = !!enabled;
    if (!ytAudioEnabled) {
      pauseMusic();
    } else if (soundOn && state === 'playing') {
      startMusic();
    }
  }

  function ytRequestInterstitialThenStart() {
    if (ytAdBusy) return;
    ytAdBusy = true;

    const start = () => {
      ytAdBusy = false;
      startRun();
    };

    if (!ytInPlayables() || !ytgame.ads || typeof ytgame.ads.requestInterstitialAd !== 'function') {
      start();
      return;
    }

    ytgame.ads.requestInterstitialAd()
      .catch(() => {})
      .finally(start);
  }

  function ytInit() {
    if (typeof ytgame === 'undefined') return;

    try {
      ytAudioEnabled = !!ytgame.system.isAudioEnabled();
      ytgame.system.onAudioEnabledChange(ytHandleAudio);
      ytgame.system.onPause(() => {
        ytExternallyPaused = true;
        ytWasPlayingBeforePause = state === 'playing';
        if (ytWasPlayingBeforePause) pause();
        else pauseMusic();
      });
      ytgame.system.onResume(() => {
        if (!ytExternallyPaused) return;
        ytExternallyPaused = false;
        if (ytWasPlayingBeforePause && state === 'paused') resume();
        else if (ytAudioEnabled && soundOn) startMusic();
        ytWasPlayingBeforePause = false;
      });
    } catch (e) { /* Playables SDK may be unavailable outside YouTube. */ }
  }

  ytInit();

  // ---------- maps ----------
  // Total points (all runs added together) needed to unlock each extra map.
  // The original map is always unlocked.
  const FOREST_UNLOCK = 5000;
  const ROCKY_UNLOCK = 6000;

  // Mix two #rrggbb colours; t is the share of a.
  const mixHex = (a, b, t) => {
    const pa = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16));
    const pb = [1, 3, 5].map((i) => parseInt(b.slice(i, i + 2), 16));
    return 'rgb(' + pa.map((v, i) => Math.round(v * t + pb[i] * (1 - t))).join(',') + ')';
  };
  const fmtNum = (n) => String(Math.max(0, Math.floor(n))).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const mulberry32 = (a) => () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

  const MAPS = [
    {
      id: 'classic', name: 'Classic', need: 0, style: null,
      blurb: 'The original pink blocks.',
      theme: { ink: '#2431D6', deep: '#141A7A', hill: 'rgba(20,26,122,0.32)', pshadow: 'rgba(20,26,122,0.7)', scrim: 'rgba(20,26,122,0.62)' }
    },
    {
      id: 'forest', name: 'Forest', need: FOREST_UNLOCK, style: 'forest',
      blurb: 'Pine and oak trees.',
      theme: {
        ink: '#1C6B57', deep: '#0C3A30', hill: 'rgba(8,50,40,0.34)', pshadow: 'rgba(8,40,32,0.7)', scrim: 'rgba(8,52,42,0.62)',
        leaf: '#5CCB6E', leafShade: '#2E9A54', leafLight: '#B4F58F', trunk: '#9A6238', trunkShade: '#6A4024'
      }
    },
    {
      id: 'rocky', name: 'Rocky', need: ROCKY_UNLOCK, style: 'rocky',
      blurb: 'Jagged boulders.',
      theme: {
        ink: '#553F8E', deep: '#2A1D52', hill: 'rgba(28,16,64,0.34)', pshadow: 'rgba(24,14,54,0.7)', scrim: 'rgba(38,24,78,0.62)',
        rock: '#A89A8E', rockShade: '#77695F', rockLight: '#D8CCBF', crack: '#4A3F39'
      }
    }
  ];
  for (const m of MAPS) m.theme.shadowSolid = mixHex(m.theme.deep, m.theme.ink, 0.55);
  const UNLOCKABLES = [];   // everything that unlocks with points: maps and sprites
  for (const m of MAPS) { m.kind = 'map'; UNLOCKABLES.push(m); }

  const mapById = (id) => MAPS.find((m) => m.id === id) || MAPS[0];
  let totalScore = parseInt(store.get('flipside-total') || '0', 10) || 0;
  const mapUnlocked = (m) => totalScore >= m.need;
  let currentMap = mapById(store.get('flipside-map') || 'classic');   // the map you last played
  if (!mapUnlocked(currentMap)) currentMap = MAPS[0];
  let pickMap = currentMap;                                            // the card highlighted on the selection screen
  let T = currentMap.theme;                                            // colours of the map on screen

  function applyTheme(m) {
    T = m.theme;
    C.ink = T.ink;
    C.deep = T.deep;
    const rs = document.documentElement.style;
    rs.setProperty('--ink', T.ink);
    rs.setProperty('--deep', T.deep);
    rs.setProperty('--scrim', T.scrim);
  }
  applyTheme(currentMap);

  // Every run adds its score to the running total. Already-banked points are remembered so pausing,
  // leaving the app or crashing can never count the same points twice.
  function bankRun() {
    const s = score();
    const d = s - (run.banked || 0);
    if (d > 0) {
      totalScore += d;
      run.banked = s;
      store.set('flipside-total', totalScore);
    }
  }

  // Maps unlocked since the player last heard about it.
  const seenUnlocks = new Set((store.get('flipside-unlock-seen') || '').split(',').filter(Boolean));
  function takeNewUnlocks() {
    const fresh = UNLOCKABLES.filter((m) => m.need > 0 && mapUnlocked(m) && !seenUnlocks.has(m.id));
    if (fresh.length) {
      fresh.forEach((m) => seenUnlocks.add(m.id));
      store.set('flipside-unlock-seen', Array.from(seenUnlocks).join(','));
    }
    return fresh;
  }
  const listNames = (a) => (a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]);
  const unlockText = (fresh) => {
    const maps = fresh.filter((m) => m.kind === 'map').map((m) => m.name);
    const skins = fresh.filter((m) => m.kind === 'sprite').map((m) => m.name);
    const parts = [];
    if (maps.length) parts.push(listNames(maps) + (maps.length > 1 ? ' maps' : ' map'));
    if (skins.length) parts.push(listNames(skins) + (skins.length > 1 ? ' sprites' : ' sprite'));
    return parts.join(' and ') + ' unlocked!';
  };

  // ----- obstacle shapes -----
  // Shapes live in "wall space": u runs along the wall (0..w) and t runs from the wall towards the tip (0..h).
  // Floor obstacles grow up from the floor, ceiling obstacles hang down from the ceiling (gravity flips, so do the trees).
  // Each shape also provides extent(t) = [left, right], the solid part at height t. The drawing and the
  // collision test both come from this same silhouette, so you only ever crash into what you can see.

  function lookPine(w, h, rng) {
    const R = (a, b) => a + rng() * (b - a);
    const cx = w / 2;
    const trunkH = clamp(h * 0.13, 12, 36);
    const trunkHW = clamp(w * 0.085, 4, 9);
    const n = clamp(Math.round(h / R(58, 70)), 2, 9);
    const t0 = trunkH * 0.6;
    const tierH = (h - t0) / (1 + (n - 1) * 0.68);
    const step = tierH * 0.68;
    const tiers = [];
    for (let k = 0; k < n; k++) {
      const f = k / (n - 1);
      const bw = cx * lerp(1.0, 0.6, f) * R(0.94, 1.0);
      const a = t0 + k * step;
      const b = k === n - 1 ? h : a + tierH;
      tiers.push({ a, b, bw, tw: k === n - 1 ? cx * 0.04 : bw * R(0.22, 0.34) });
    }
    const extent = (t) => {
      let hw = t <= trunkH ? trunkHW : 0;
      for (const q of tiers) {
        if (t >= q.a && t <= q.b) hw = Math.max(hw, lerp(q.bw, q.tw, (t - q.a) / (q.b - q.a)));
      }
      return [cx - hw, cx + hw];
    };
    return { kind: 'pine', cx, trunkH, trunkHW, tiers, extent };
  }

  function lookOak(w, h, rng) {
    const R = (a, b) => a + rng() * (b - a);
    const cx = w / 2;
    let canopyH = clamp(Math.max(w * R(1.1, 1.5), h * 0.34), 54, h * 0.66);
    if (h < 96) canopyH = h * 0.74;
    const ry = canopyH / 2, rx = cx, tc = h - ry;
    const trunkTop = h - canopyH * 0.5;
    const trunkHW = clamp(w * 0.1 + h * 0.008, 5, 13);
    const ph = R(0, 6.28), lobe = R(0.05, 0.1);
    const canopyHW = (t) => {
      const d = (t - tc) / ry;
      if (Math.abs(d) >= 1) return 0;
      return rx * Math.sqrt(1 - d * d) * (1 - lobe * (0.5 + 0.5 * Math.sin(d * 9 + ph)));
    };
    const extent = (t) => {
      const hw = Math.max(t <= trunkTop ? trunkHW : 0, canopyHW(t));
      return [cx - hw, cx + hw];
    };
    const pts = [];
    const steps = 22;
    for (let k = 0; k <= steps; k++) { const t = tc - ry + (2 * ry * k) / steps; pts.push([cx - canopyHW(t), t]); }
    for (let k = steps; k >= 0; k--) { const t = tc - ry + (2 * ry * k) / steps; pts.push([cx + canopyHW(t), t]); }
    return { kind: 'oak', cx, trunkTop, trunkHW, tc, ry, rx, canopyPts: pts, extent };
  }

  function lookRock(w, h, rng) {
    const R = (a, b) => a + rng() * (b - a);
    const nV = clamp(Math.round(h / 36) + 4, 6, 15);
    const taper = R(0.26, 0.55), pw = R(1.1, 1.9), lean = R(-0.14, 0.14);
    const bumps = [];
    const nb = rng() < 0.7 ? 3 : 2;
    for (let i = 0; i < nb; i++) bumps.push({ s0: R(0.2, 0.8), sg: R(0.07, 0.14), amp: R(0.16, 0.34) });
    const ss = [0];
    for (let j = 1; j < nV - 1; j++) ss.push(clamp(j / (nV - 1) + R(-0.3, 0.3) / (nV - 1), 0.02, 0.98));
    ss.push(1);
    ss.sort((a, b) => a - b);
    const Lp = [], Rp = [];
    for (let j = 0; j < nV; j++) {
      const s = ss[j];
      let hw = 0.5 * (1 - taper * Math.pow(s, pw));
      for (const b of bumps) hw += b.amp * 0.5 * Math.exp(-Math.pow((s - b.s0) / b.sg, 2));
      const c = 0.5 + lean * s;
      let hl = hw * (1 + (j === 0 ? 0 : R(-0.16, 0.12)));
      let hr = hw * (1 + (j === 0 ? 0 : R(-0.12, 0.16)));
      if (j === nV - 1) { hl = R(0.1, 0.18); hr = R(0.1, 0.18); }
      Lp.push([clamp((c - hl) * w, 0, w), s * h]);
      Rp.push([clamp((c + hr) * w, 0, w), s * h]);
    }
    const at = (P, t) => {
      if (t <= P[0][1]) return P[0][0];
      for (let i = 1; i < P.length; i++) {
        if (t <= P[i][1]) {
          const a = P[i - 1], b = P[i];
          return a[0] + (b[0] - a[0]) * ((t - a[1]) / Math.max(1e-6, b[1] - a[1]));
        }
      }
      return P[P.length - 1][0];
    };
    const extent = (t) => [at(Lp, t), at(Rp, t)];
    // facets and cracks, drawn inside the outline
    const ridge = [0, 0.3, 0.62, 1].map((s) => [clamp((0.5 + lean * s + R(-0.08, 0.08)) * w, 0, w), s * h]);
    const dark = ridge.concat([[w + 30, h], [w + 30, 0]]);
    const light = [[-30, h * 0.3]].concat(ridge.slice(1).map(([u, t]) => [u - w * 0.16, t]), [[-30, h]]);
    const cracks = [];
    for (let i = 0; i < 2; i++) {
      const s = R(0.3, 0.8), fromLeft = rng() < 0.5;
      const e = extent(s * h);
      let u = fromLeft ? e[0] : e[1], t = s * h;
      const line = [[u, t]];
      for (let k = 0; k < 3; k++) { u += (fromLeft ? 1 : -1) * R(4, 12); t -= R(6, 16); line.push([u, t]); }
      cracks.push(line);
    }
    return { kind: 'rock', outline: Lp.concat(Rp.slice().reverse()), dark, light, cracks, extent };
  }

  const LOOKS = {
    forest: (w, h, rng, kind) => ((kind || (rng() < 0.62 ? 'pine' : 'oak')) === 'pine' ? lookPine(w, h, rng) : lookOak(w, h, rng)),
    rocky: (w, h, rng) => lookRock(w, h, rng)
  };

  // Turn a silhouette into thin slices the collision test can walk through quickly.
  function buildProf(h, extent) {
    const n = clamp(Math.round(h / 4), 16, 200);         // thin slices (about 4px) so slanted edges stay accurate
    const x0 = new Array(n), x1 = new Array(n);
    for (let i = 0; i < n; i++) {
      const e = extent(((i + 0.5) * h) / n);
      x0[i] = e[0]; x1[i] = e[1];
    }
    return { n, x0, x1 };
  }

  function decorateObstacle(o) {
    const st = currentMap.style;
    if (!st) return;                                   // Classic keeps its plain solid blocks
    o.look = LOOKS[st](o.w, o.h, Math.random);
    o.prof = buildProf(o.h, o.look.extent);
  }

  // Does the player's box touch this obstacle? Classic blocks are solid boxes; trees and rocks use their silhouette.
  function hitsObstacle(o, px0, px1, py0, py1) {
    if (!(px1 > o.x && px0 < o.x + o.w)) return false;
    const oy0 = o.side === 'floor' ? BOT - o.h : TOP;
    const oy1 = o.side === 'floor' ? BOT : TOP + o.h;
    if (!(py1 > oy0 && py0 < oy1)) return false;
    const pr = o.prof;
    if (!pr) return true;
    let ta, tb;
    if (o.side === 'floor') { ta = BOT - py1; tb = BOT - py0; } else { ta = py0 - TOP; tb = py1 - TOP; }
    ta = Math.max(0, ta); tb = Math.min(o.h, tb);
    const sh = o.h / pr.n;
    const i0 = Math.min(pr.n - 1, Math.floor(ta / sh));
    const i1 = Math.min(pr.n - 1, Math.floor(tb / sh));
    for (let i = i0; i <= i1; i++) {
      if (px1 > o.x + pr.x0[i] && px0 < o.x + pr.x1[i]) return true;
    }
    return false;
  }

  // ----- drawing the shapes -----
  function pathPoly(g, P, pts) {
    g.beginPath();
    for (let i = 0; i < pts.length; i++) {
      const q = P(pts[i][0], pts[i][1]);
      if (i) g.lineTo(q[0], q[1]); else g.moveTo(q[0], q[1]);
    }
    g.closePath();
  }
  function fillPoly(g, P, pts, color) { g.fillStyle = color; pathPoly(g, P, pts); g.fill(); }

  function paintPine(g, o, P, th, flat) {
    const L = o.look, cx = L.cx;
    fillPoly(g, P, [[cx - L.trunkHW, 0], [cx + L.trunkHW, 0], [cx + L.trunkHW, L.trunkH], [cx - L.trunkHW, L.trunkH]], flat ? th.shadowSolid : th.trunk);
    if (!flat) fillPoly(g, P, [[cx + L.trunkHW * 0.2, 0], [cx + L.trunkHW, 0], [cx + L.trunkHW, L.trunkH], [cx + L.trunkHW * 0.2, L.trunkH]], th.trunkShade);
    for (const q of L.tiers) {
      fillPoly(g, P, [[cx - q.bw, q.a], [cx + q.bw, q.a], [cx + q.tw, q.b], [cx - q.tw, q.b]], flat ? th.shadowSolid : th.leaf);
      if (!flat) {
        fillPoly(g, P, [[cx, q.a], [cx + q.bw, q.a], [cx + q.tw, q.b], [cx, q.b]], th.leafShade);
        fillPoly(g, P, [[cx - q.bw, q.a], [cx - q.bw * 0.78, q.a], [cx - q.tw * 0.78, q.b], [cx - q.tw, q.b]], th.leafLight);
      }
    }
  }

  function paintOak(g, o, P, th, flat) {
    const L = o.look, cx = L.cx;
    fillPoly(g, P, [[cx - L.trunkHW, 0], [cx + L.trunkHW, 0], [cx + L.trunkHW, L.trunkTop + 4], [cx - L.trunkHW, L.trunkTop + 4]], flat ? th.shadowSolid : th.trunk);
    if (!flat) fillPoly(g, P, [[cx + L.trunkHW * 0.2, 0], [cx + L.trunkHW, 0], [cx + L.trunkHW, L.trunkTop + 4], [cx + L.trunkHW * 0.2, L.trunkTop + 4]], th.trunkShade);
    fillPoly(g, P, L.canopyPts, flat ? th.shadowSolid : th.leaf);
    if (flat) return;
    g.save();
    pathPoly(g, P, L.canopyPts);
    g.clip();
    const s = P(cx + L.rx * 0.55, L.tc - L.ry * 0.35);
    g.fillStyle = th.leafShade;
    g.beginPath(); g.arc(s[0], s[1], L.rx * 0.95, 0, Math.PI * 2); g.fill();
    g.fillStyle = th.leafLight;
    const dots = [[-0.45, 0.42, 0.17], [-0.12, 0.62, 0.12], [-0.55, 0.05, 0.11]];
    for (const d of dots) {
      const c = P(cx + L.rx * d[0], L.tc + L.ry * d[1]);
      g.beginPath(); g.arc(c[0], c[1], L.rx * d[2], 0, Math.PI * 2); g.fill();
    }
    g.restore();
  }

  function paintRock(g, o, P, th, flat) {
    const L = o.look;
    fillPoly(g, P, L.outline, flat ? th.shadowSolid : th.rock);
    if (flat) return;
    g.save();
    pathPoly(g, P, L.outline);
    g.clip();
    fillPoly(g, P, L.dark, th.rockShade);
    g.globalAlpha = 0.55;
    fillPoly(g, P, L.light, th.rockLight);
    g.globalAlpha = 1;
    g.strokeStyle = th.crack;
    g.lineWidth = 2;
    g.lineJoin = 'round';
    for (const line of L.cracks) {
      g.beginPath();
      line.forEach((pt, i) => { const q = P(pt[0], pt[1]); if (i) g.lineTo(q[0], q[1]); else g.moveTo(q[0], q[1]); });
      g.stroke();
    }
    g.restore();
  }
  const PAINT = { pine: paintPine, oak: paintOak, rock: paintRock };

  // Same hard drop shadow the original blocks have, then the shape itself.
  function paintObstacle(g, o, top, bot, th) {
    const P = o.side === 'floor' ? (u, t) => [o.x + u, bot - t] : (u, t) => [o.x + u, top + t];
    const fn = PAINT[o.look.kind];
    g.save();
    g.translate(7, 7);
    fn(g, o, P, th, true);
    g.restore();
    fn(g, o, P, th, false);
  }

  // ----- map preview thumbnails -----
  function drawMapThumb(cv, m) {
    const g = cv.getContext('2d');
    if (!g) return;
    const Wt = 330, Ht = 193, top = 34, bot = 159, th = m.theme;
    g.setTransform(cv.width / Wt, 0, 0, cv.height / Ht, 0, 0);
    g.fillStyle = th.ink; g.fillRect(0, 0, Wt, Ht);
    g.fillStyle = th.hill;
    g.beginPath(); g.arc(70, 120, 60, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.arc(250, 70, 48, 0, Math.PI * 2); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.12)';
    for (let y = top + 16, row = 0; y < bot; y += 30, row++) {
      for (let x = (row % 2) * 15 + 6; x < Wt; x += 30) { g.beginPath(); g.arc(x, y, 2.2, 0, Math.PI * 2); g.fill(); }
    }
    const rng = mulberry32(m.id === 'forest' ? 7 : m.id === 'rocky' ? 21 : 3);
    const items = [{ x: 58, w: 66, h: 92, side: 'floor', kind: 'pine' }, { x: 204, w: 60, h: 80, side: 'ceil', kind: 'oak' }];
    for (const o of items) {
      if (m.style) {
        o.look = LOOKS[m.style](o.w, o.h, rng, o.kind);
        paintObstacle(g, o, top, bot, th);
      } else {
        const y = o.side === 'floor' ? bot - o.h : top;
        g.fillStyle = 'rgba(20,26,122,0.55)'; g.fillRect(o.x + 7, y + 7, o.w, o.h);
        g.fillStyle = C.pink; g.fillRect(o.x, y, o.w, o.h);
        g.fillStyle = C.blush;
        if (o.side === 'floor') g.fillRect(o.x, y, o.w, 10); else g.fillRect(o.x, y + o.h - 10, o.w, 10);
      }
    }
    g.fillStyle = th.deep;
    g.fillRect(0, 0, Wt, top);
    g.fillRect(0, bot, Wt, Ht - bot);
    g.strokeStyle = C.pink; g.globalAlpha = 0.9; g.lineWidth = 2.5;
    g.beginPath(); g.arc(160, (top + bot) / 2, 14, 0, Math.PI * 2); g.stroke();
    g.globalAlpha = 1;
    g.fillStyle = C.blush;
    g.beginPath(); g.arc(160, (top + bot) / 2, 9, 0, Math.PI * 2); g.fill();
  }

  // ----- the map selection screen -----
  const LOCK_SVG = '<svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M17 9V7a5 5 0 0 0-10 0v2H5v12h14V9h-2zm-8 0V7a3 3 0 0 1 6 0v2H9z"/></svg>';

  function buildMapCards() {
    mapTotal.textContent = fmtNum(totalScore);
    const fresh = takeNewUnlocks();
    if (fresh.length) { mapNew.hidden = false; mapNew.textContent = unlockText(fresh); } else { mapNew.hidden = true; }
    mapMsg.textContent = '';
    mapList.innerHTML = '';
    for (const m of MAPS) {
      const open = mapUnlocked(m);
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'mapcard' + (open ? '' : ' locked') + (m === pickMap ? ' picked' : '');
      card.dataset.map = m.id;
      card.setAttribute('role', 'radio');
      card.setAttribute('aria-checked', m === pickMap ? 'true' : 'false');
      const need = m.need > 0 ? 'Requires ' + fmtNum(m.need) + ' points' : 'Always unlocked';
      card.setAttribute('aria-label', m.name + ' map, ' + (open ? 'unlocked' : 'locked') + '. ' + need + '.');
      const pct = m.need > 0 ? Math.min(100, Math.floor((totalScore / m.need) * 100)) : 100;
      card.innerHTML =
        '<canvas class="mapthumb" width="232" height="136" aria-hidden="true"></canvas>' +
        '<span class="mapinfo">' +
          '<span class="maphead">' +
            '<span class="mapname">' + m.name + '</span>' +
            '<span class="mapstate ' + (open ? 'on' : 'off') + '">' + (open ? 'Unlocked' : LOCK_SVG + 'Locked') + '</span>' +
            '<span class="mapsel">Selected</span>' +
          '</span>' +
          '<span class="mapneed">' + need + '</span>' +
          (open
            ? '<span class="mapdesc">' + m.blurb + '</span>'
            : '<span class="mapbar"><i style="width:' + pct + '%"></i></span><span class="mapprog">' + fmtNum(totalScore) + ' / ' + fmtNum(m.need) + '</span>') +
        '</span>';
      mapList.appendChild(card);
      drawMapThumb(card.querySelector('canvas'), m);
    }
  }

  function refreshPicks() {
    for (const card of mapList.children) {
      const on = card.dataset.map === pickMap.id;
      card.classList.toggle('picked', on);
      card.setAttribute('aria-checked', on ? 'true' : 'false');
    }
  }

  function showMaps() {
    if (state !== 'menu' && state !== 'over') return;
    state = 'maps';
    stopMusic();
    resetRun();
    setUi();
    pickMap = currentMap;
    applyTheme(pickMap);
    buildMapCards();
    overlay.hidden = true;
    mapOverlay.hidden = false;
  }

  function playPicked() {
    if (state !== 'maps' || !mapUnlocked(pickMap)) return;
    currentMap = pickMap;
    store.set('flipside-map', currentMap.id);
    applyTheme(currentMap);
    startRun();
  }

  function backFromMaps() {
    if (state !== 'maps') return;
    applyTheme(currentMap);
    toMenu();
  }

  mapList.addEventListener('click', (e) => {

  // ---------- sprites: cosmetic player skins ----------
  // Total points needed for each skin. The first skin is the original look and is always unlocked.
  // Skins only change how the player LOOKS. The hitbox and all gameplay stay exactly the same.
  const SPRITE_UNLOCKS = [10000, 20000, 30000, 40000, 50000];
  const SPRITES = [
    { id: 'sunny', name: 'Sunny', need: 0, body: '#FFD23F', trail: '255,210,63', blurb: 'The original.', extra: null },
    { id: 'ember', name: 'Ember', need: SPRITE_UNLOCKS[0], body: '#FF8A2B', hi: '#FFC38A', trail: '255,138,43', blurb: 'A little flame on top.', extra: 'flame' },
    { id: 'frost', name: 'Frost', need: SPRITE_UNLOCKS[1], body: '#8FEFFF', hi: '#E9FCFF', trail: '143,239,255', blurb: 'Ice spikes, cool head.', extra: 'spikes' },
    { id: 'slime', name: 'Slime', need: SPRITE_UNLOCKS[2], body: '#C6F03A', hi: '#EEFFA6', trail: '198,240,58', blurb: 'Antennae included.', extra: 'antennae' },
    { id: 'royal', name: 'Royal', need: SPRITE_UNLOCKS[3], body: '#F4F1FF', hi: '#FFFFFF', trail: '244,241,255', blurb: 'Wears the crown.', extra: 'crown' },
    { id: 'golden', name: 'Golden', need: SPRITE_UNLOCKS[4], body: '#FFE7A0', hi: '#FFFFFF', rim: '#E8B923', trail: '255,224,120', blurb: 'Halo and sparkle.', extra: 'halo' }
  ];
  for (const s of SPRITES) s.kind = 'sprite';
  UNLOCKABLES.push(...SPRITES);

  const spriteById = (id) => SPRITES.find((s) => s.id === id) || SPRITES[0];
  let SP = spriteById(store.get('flipside-sprite') || 'sunny');    // the skin you have equipped
  if (!mapUnlocked(SP)) SP = SPRITES[0];
  let spriteHead = 1;   // 1 = head up, -1 = head down; eases over when gravity flips so the extras flip with it

  function rrg(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  // Small extras drawn on the body of every skin except the original.
  function paintSpriteFinish(g, sp, x, y, w, h) {
    if (!sp.hi) return;
    const a0 = g.globalAlpha;
    g.fillStyle = sp.hi;
    g.globalAlpha = a0 * 0.65;
    g.fillRect(x + 4, y + 4, w * 0.3, 3);
    g.fillRect(x + 4, y + 4, 3, h * 0.22);
    g.globalAlpha = a0;
    if (sp.rim) {
      g.strokeStyle = sp.rim;
      g.lineWidth = 2;
      rrg(g, x + 1, y + 1, w - 2, h - 2, 7);
      g.stroke();
    }
  }

  // Draws the skin's head decoration. (0,0) is the body centre and the head is towards -y.
  // head = 1 (up) ... -1 (hanging down), so on the ceiling the crown hangs down too.
  function paintSpriteExtras(g, sp, cx, cy, w, h, head, t) {
    if (!sp.extra) return;
    const hw = w / 2, hh = h / 2;
    g.save();
    g.translate(cx, cy);
    g.scale(1, head);
    switch (sp.extra) {
      case 'flame': {
        const f = t ? 1 + Math.sin(t * 12) * 0.14 : 1;
        const tuft = (x, base, ht, col) => {
          g.fillStyle = col;
          g.beginPath();
          g.moveTo(x - base, -hh + 1);
          g.quadraticCurveTo(x - base * 0.9, -hh - ht * 0.55, x, -hh - ht);
          g.quadraticCurveTo(x + base * 0.9, -hh - ht * 0.55, x + base, -hh + 1);
          g.closePath();
          g.fill();
        };
        tuft(-9, 4.5, 9 * f, '#FF4D2E');
        tuft(9, 4.5, 9 * (2 - f), '#FF4D2E');
        tuft(0, 6.5, 15 * f, '#FF4D2E');
        tuft(0, 3.4, 8.5 * f, '#FFD23F');
        break;
      }
      case 'spikes': {
        for (const [x, b, ht] of [[-9.5, 6.5, 9], [0, 8, 14], [9.5, 6.5, 9]]) {
          g.fillStyle = '#E9FCFF';
          g.beginPath(); g.moveTo(x - b, -hh + 1); g.lineTo(x, -hh - ht); g.lineTo(x + b, -hh + 1); g.closePath(); g.fill();
          g.fillStyle = '#BDEFF9';
          g.beginPath(); g.moveTo(x, -hh + 1); g.lineTo(x, -hh - ht); g.lineTo(x + b, -hh + 1); g.closePath(); g.fill();
        }
        break;
      }
      case 'antennae': {
        g.lineCap = 'round';
        for (const s of [-1, 1]) {
          g.strokeStyle = '#7B9A16';
          g.lineWidth = 2.2;
          g.beginPath(); g.moveTo(s * 7, -hh + 1); g.lineTo(s * 11, -hh - 10); g.stroke();
          g.fillStyle = '#E9FF8F';
          g.beginPath(); g.arc(s * 11, -hh - 11, 3.2, 0, Math.PI * 2); g.fill();
          g.strokeStyle = '#7B9A16';
          g.lineWidth = 1.4;
          g.beginPath(); g.arc(s * 11, -hh - 11, 3.2, 0, Math.PI * 2); g.stroke();
        }
        break;
      }
      case 'crown': {
        const yb = -hh;
        g.fillStyle = '#FFC933';
        g.beginPath();
        g.moveTo(-9.5, yb + 1); g.lineTo(-9.5, yb - 12); g.lineTo(-4.8, yb - 6.5); g.lineTo(0, yb - 14);
        g.lineTo(4.8, yb - 6.5); g.lineTo(9.5, yb - 12); g.lineTo(9.5, yb + 1);
        g.closePath();
        g.fill();
        g.fillStyle = '#E8A800';
        g.fillRect(-9.5, yb - 3, 19, 4);
        g.fillStyle = '#FF5C93';
        g.beginPath(); g.arc(0, yb - 1, 1.5, 0, Math.PI * 2); g.fill();
        g.fillStyle = '#5FD3FF';
        g.beginPath(); g.arc(-5.5, yb - 1, 1.3, 0, Math.PI * 2); g.fill();
        g.beginPath(); g.arc(5.5, yb - 1, 1.3, 0, Math.PI * 2); g.fill();
        break;
      }
      case 'halo': {
        const bob = t ? Math.sin(t * 3) * 1.4 : 0;
        g.lineWidth = 3.6;
        g.strokeStyle = '#E8B923';
        g.beginPath(); g.ellipse(0, -hh - 8 + bob, 11, 3.8, 0, 0, Math.PI * 2); g.stroke();
        g.lineWidth = 1.8;
        g.strokeStyle = '#FFF3B0';
        g.beginPath(); g.ellipse(0, -hh - 8 + bob, 11, 3.8, 0, 0, Math.PI * 2); g.stroke();
        const sx = hw - 2, sy = -hh + 4, r = 3 * (t ? 0.8 + 0.2 * Math.sin(t * 6) : 1);
        g.fillStyle = '#FFFFFF';
        g.beginPath();
        g.moveTo(sx, sy - r * 1.6); g.lineTo(sx + r * 0.5, sy - r * 0.5); g.lineTo(sx + r * 1.6, sy);
        g.lineTo(sx + r * 0.5, sy + r * 0.5); g.lineTo(sx, sy + r * 1.6); g.lineTo(sx - r * 0.5, sy + r * 0.5);
        g.lineTo(sx - r * 1.6, sy); g.lineTo(sx - r * 0.5, sy - r * 0.5);
        g.closePath();
        g.fill();
        break;
      }
    }
    g.restore();
  }

  // Preview picture for a skin card: the skin standing on a floor.
  function drawSpriteThumb(cv, sp) {
    const g = cv.getContext('2d');
    if (!g) return;
    const th = MAPS[0].theme;
    g.setTransform(cv.width / 88, 0, 0, cv.height / 64, 0, 0);
    g.fillStyle = th.ink; g.fillRect(0, 0, 88, 64);
    g.fillStyle = 'rgba(255,255,255,0.12)';
    for (const [dx, dy] of [[10, 12], [34, 20], [60, 10], [80, 26], [20, 34], [70, 40], [46, 42]]) { g.beginPath(); g.arc(dx, dy, 1.8, 0, Math.PI * 2); g.fill(); }
    g.fillStyle = th.deep; g.fillRect(0, 54, 88, 10);
    const w = 34, h = 34, x = 44 - w / 2, y = 54 - h;
    g.fillStyle = th.pshadow; rrg(g, x + 3, y + 3, w, h, 8); g.fill();
    g.fillStyle = sp.body; rrg(g, x, y, w, h, 8); g.fill();
    paintSpriteFinish(g, sp, x, y, w, h);
    g.fillStyle = th.deep;
    g.beginPath(); g.arc(x + w * 0.34, y + h / 2 + 3, 3.6, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.arc(x + w * 0.72, y + h / 2 + 3, 3.6, 0, Math.PI * 2); g.fill();
    paintSpriteExtras(g, sp, 44, y + h / 2, w, h, 1, 0);
  }

  // ----- the sprites screen -----
  function buildSpriteCards() {
    spriteTotal.textContent = fmtNum(totalScore);

        '<span class="mapneed">' + need + '</span>' +

          ? '<span class="mapdesc">' + s.blurb + '</span>'

  // ----- settings -----

  // ----- home menu and screen flow -----
  const HOME_PLAY_OPENS_MAP_SELECT = false;   // true = Play on the home page opens the map screen first (the earlier flow)
  const inMenus = () => state === 'menu' || state === 'maps' || state === 'sprites' || state === 'settings';

    if (HOME_PLAY_OPENS_MAP_SELECT) { showMaps(); return; }

  }
